# =============================================================================
# Security Gates Workflow — Azure DevSecOps
# =============================================================================
# Triggered on every Pull Request. All jobs are mandatory status checks.
# A PR cannot be merged if any job fails CRITICAL/HIGH threshold.
#
# CVSS Thresholds (enforced per job):
#   > 9.0       → fail job (exit 1) — blocks merge
#   7.0 – 8.9  → warning + auto-create GitHub issue — does NOT block merge
#   < 7.0       → log only — informational
#
# Required secrets:
#   SEMGREP_APP_TOKEN, SNYK_TOKEN, FOSSA_API_KEY, TRUFFLEHOG_GITHUB_TOKEN
# =============================================================================

name: Security Gates

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
  # Allow manual trigger for re-scan
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to scan"
        required: false
        default:  ""

concurrency:
  group: security-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents:        read
  security-events: write  # Upload SARIF to GitHub Security tab
  issues:          write  # Create tracking tickets for HIGH findings
  pull-requests:   write  # Post inline comments on PRs
  id-token:        write  # OIDC for FOSSA

# Shared threshold constants surfaced as env vars for all jobs
env:
  CVSS_CRITICAL_THRESHOLD: "9.0"
  CVSS_HIGH_THRESHOLD:     "7.0"
  PYTHON_VERSION:          "3.12"
  NODE_VERSION:            "20"

# =============================================================================
# JOB 1 — Pre-commit Checks (gitleaks + detect-secrets)
# =============================================================================
jobs:
  pre-commit-check:
    name: Pre-commit — Secret Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for credential scanning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "$BASE" "$HEAD" > changed_files.txt
          else
            git diff --name-only HEAD~1 HEAD > changed_files.txt
          fi
          echo "Changed files:"
          cat changed_files.txt

      # ── gitleaks ────────────────────────────────────────────────────────────
      # The gitleaks-action wrapper builds its own argv and writes results.sarif,
      # so it silently ignored our --config/--report-path. Run the CLI directly
      # to guarantee security/.gitleaks.toml is applied and the SARIF lands where
      # the upload step expects it.
      - name: Install gitleaks
        uses: ./.github/actions/install-tool
        with:
          tool: gitleaks
          version: "8.30.1"

      - name: Run gitleaks (PR commit range)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            LOG_OPTS=""
          fi

          set +e
          gitleaks detect \
            --source . \
            --config security/.gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            ${LOG_OPTS}
          GITLEAKS_EXIT=$?
          set -e

          # 0 = clean, 1 = leaks found, anything else = tool error
          if [ "$GITLEAKS_EXIT" -gt 1 ]; then
            echo "::error::gitleaks failed to run (exit $GITLEAKS_EXIT)"
            exit "$GITLEAKS_EXIT"
          fi
          if [ "$GITLEAKS_EXIT" -eq 1 ]; then
            echo "::error::gitleaks detected hardcoded secrets — blocking PR"
            exit 1
          fi
          echo "gitleaks: no secrets detected."

      - name: Upload gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category:   gitleaks

      # ── detect-secrets ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install detect-secrets
        run: pip install --quiet detect-secrets

      # The keyword heuristic flags this step's own shell block (it is dense with
      # the word "secret") when scanning this workflow file. It is a comment and
      # a CLI invocation, not a credential — annotated rather than baselined so
      # the exemption stays visible at the point of use.
      - name: Scan changed files for hardcoded credentials
        run: |  # pragma: allowlist secret
          # detect-secrets-hook is the CI entrypoint: it diffs the changed files
          # against the baseline and exits non-zero only on NEW findings.
          # (`detect-secrets scan --only-allowlisted` is not a real flag and the
          # old `audit --json` parsing counted every baselined entry as live.)
          FILES=$(grep -v '^$' changed_files.txt | tr '\n' ' ' || true)
          if [ -z "$FILES" ]; then
            echo "No changed files to scan."
            exit 0
          fi

          # Only pass files that still exist (deletions appear in the diff too).
          EXISTING=""
          for f in $FILES; do
            [ -f "$f" ] && EXISTING="$EXISTING $f"
          done
          if [ -z "$EXISTING" ]; then
            echo "No existing changed files to scan."
            exit 0
          fi

          if ! detect-secrets-hook --baseline .secrets.baseline $EXISTING; then
            echo "::error::detect-secrets found new potential secrets in changed files — blocking PR"
            exit 1
          fi
          echo "detect-secrets: no new secrets found."

# =============================================================================
# JOB 2 — SAST: Semgrep (OWASP Top-10 + security-audit)
# =============================================================================
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.89.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep with security rulesets
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          # The semgrep container ships busybox sh, not bash — ${PIPESTATUS[0]}
          # is a bash-ism and aborted the step with "bad substitution".
          # Capture the exit code directly and let the CVSS gate below decide
          # pass/fail (hence no --error here).
          set +e
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --config "p/secrets" \
            --sarif \
            --output semgrep.sarif \
            --timeout 60 \
            . > semgrep.log 2>&1
          SEMGREP_EXIT=$?
          set -e

          tail -50 semgrep.log
          echo "semgrep_exit=${SEMGREP_EXIT}" >> "$GITHUB_ENV"

          # Exit codes: 0 = no findings, 1 = findings (gate decides), >1 = tool error
          if [ "${SEMGREP_EXIT}" -gt 1 ]; then
            echo "::error::Semgrep failed to run (exit ${SEMGREP_EXIT})"
            exit "${SEMGREP_EXIT}"
          fi

      - name: Enforce CVSS thresholds (Semgrep)
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, sys, subprocess, os

          sarif_path = "semgrep.sarif"
          if not os.path.exists(sarif_path):
              print("No Semgrep SARIF output found — treating as clean.")
              sys.exit(0)

          with open(sarif_path) as f:
              sarif = json.load(f)

          critical, high, medium = 0, 0, 0
          findings = []

          for run in sarif.get("runs", []):
              rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  level    = result.get("level", "note")
                  rule_id  = result.get("ruleId", "")
                  message  = result.get("message", {}).get("text", "")
                  locations = result.get("locations", [])
                  location  = ""
                  if locations:
                      pl = locations[0].get("physicalLocation", {})
                      location = f"{pl.get('artifactLocation', {}).get('uri', '')}:{pl.get('region', {}).get('startLine', '')}"

                  findings.append({"level": level, "rule": rule_id, "msg": message, "loc": location})

                  if level == "error":
                      critical += 1
                  elif level == "warning":
                      high += 1
                  else:
                      medium += 1

          print(f"Semgrep — CRITICAL: {critical}, HIGH: {high}, MEDIUM/INFO: {medium}")

          for f in findings:
              if f["level"] == "error":
                  print(f"  [CRITICAL] {f['rule']} @ {f['loc']}: {f['msg'][:120]}")
              elif f["level"] == "warning":
                  print(f"  [HIGH]     {f['rule']} @ {f['loc']}: {f['msg'][:120]}")

          if critical > 0:
              print(f"\n::error::Semgrep CRITICAL findings ({critical}) — CVSS > 9.0 policy violation, blocking PR")
              sys.exit(1)
          elif high > 0:
              print(f"\n::warning::Semgrep HIGH findings ({high}) — CVSS 7.0-8.9, ticket will be filed")
          PYEOF

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category:   semgrep-pr

# =============================================================================
# JOB 3 — SAST: Bandit (Python files only)
# =============================================================================
  sast-bandit:
    name: SAST — Bandit (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python file changes
        id: py-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COUNT=$(git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              | grep -c '\.py$' || true)
          else
            COUNT=$(git diff --name-only HEAD~1 HEAD | grep -c '\.py$' || true)
          fi
          echo "py_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Python files changed: ${COUNT}"

      - name: Set up Python
        if: steps.py-check.outputs.py_count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        if: steps.py-check.outputs.py_count != '0'
        run: pip install --quiet bandit[sarif]

      - name: Run Bandit
        if: steps.py-check.outputs.py_count != '0'
        run: |
          # -ll is the short form of --severity-level medium; passing both is a
          # hard argparse conflict ("not allowed with argument --severity-level")
          # that aborted the step before any SARIF was written.
          set +e
          bandit -r . \
            --format sarif \
            --output bandit.sarif \
            --severity-level medium \
            --confidence-level medium \
            --exclude ./.venv,./venv,./node_modules,./app/tests,./lab
          BANDIT_EXIT=$?
          set -e

          echo "Bandit exit code: ${BANDIT_EXIT}"
          # 0 = clean, 1 = findings (the gate below decides), >1 = tool error
          if [ "${BANDIT_EXIT}" -gt 1 ]; then
            echo "::error::Bandit failed to run (exit ${BANDIT_EXIT})"
            exit "${BANDIT_EXIT}"
          fi

      - name: Enforce CVSS thresholds (Bandit)
        if: steps.py-check.outputs.py_count != '0'
        run: |
          python3 - <<'PYEOF'
          import json, sys, os

          if not os.path.exists("bandit.sarif"):
              print("No Bandit output — skipping.")
              sys.exit(0)

          with open("bandit.sarif") as f:
              sarif = json.load(f)

          # Bandit maps HIGH severity + HIGH confidence → CRITICAL (CVSS > 9)
          # HIGH severity + MEDIUM confidence → HIGH (CVSS 7-8.9)
          critical, high, medium = 0, 0, 0
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  level = result.get("level", "note")
                  props = result.get("properties", {})
                  sev   = props.get("issue_severity", "").upper()
                  conf  = props.get("issue_confidence", "").upper()

                  if sev == "HIGH" and conf == "HIGH":
                      critical += 1
                  elif sev == "HIGH":
                      high += 1
                  else:
                      medium += 1

          print(f"Bandit — CRITICAL (HIGH/HIGH): {critical}, HIGH: {high}, MEDIUM: {medium}")
          if critical > 0:
              print(f"::error::Bandit found {critical} CRITICAL Python security issues — blocking PR")
              sys.exit(1)
          elif high > 0:
              print(f"::warning::Bandit found {high} HIGH Python security issues")
          PYEOF

      - name: Upload Bandit SARIF
        if: always() && steps.py-check.outputs.py_count != '0' && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category:   bandit

      - name: Skip message (no Python files)
        if: steps.py-check.outputs.py_count == '0'
        run: echo "No Python files changed — Bandit scan skipped."

# =============================================================================
# JOB 4 — SCA: Trivy Filesystem Dependency Scan
# =============================================================================
  sca-trivy:
    name: SCA — Trivy Filesystem Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: ./.github/actions/trivy-scan
        with:
          scan-type:      fs
          scan-ref:       .
          output:         trivy-fs-pr.sarif
          severity:       CRITICAL,HIGH,MEDIUM
          ignore-unfixed: "true"

      # Shared gate: reads the real CVSS score from the SARIF rule properties.
      # Trivy maps BOTH critical and high to level "error", so the old inline
      # check blocked on HIGH findings that policy says should only warn.
      - name: Enforce CVSS thresholds (SCA — Trivy)
        id: sca-gate
        run: |
          python3 .github/scripts/cvss_gate.py trivy-fs-pr.sarif \
            --tool "Trivy SCA" \
            --critical "${CVSS_CRITICAL_THRESHOLD}" \
            --high "${CVSS_HIGH_THRESHOLD}" \
            --json-out sca-findings.json

      - name: Upload Trivy SCA SARIF
        if: always() && hashFiles('trivy-fs-pr.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-pr.sarif
          category:   trivy-sca-pr

      - name: Create GitHub issue for HIGH findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `[SECURITY] HIGH/CRITICAL CVEs found in PR #${context.issue.number}`,
              body: `## Security Finding\n\n**Workflow:** ${context.workflow}\n**PR:** #${context.issue.number}\n**Commit:** ${context.sha}\n\nTrivy detected CRITICAL/HIGH CVEs in dependency scan. Review the [Security tab](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning) for details.\n\n**CVSS Threshold Policy:**\n- CVSS > 9.0 → blocked build\n- CVSS 7.0-8.9 → this ticket (must be remediated within 30 days)\n- CVSS < 7.0 → logged only`,
              labels: ["security", "vulnerability", "high-priority"]
            });

# =============================================================================
# JOB 5 — Secret Scan: TruffleHog3 Deep Scan
# =============================================================================
  secret-scan:
    name: Secret Scan — TruffleHog3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # TruffleHog has no --format/--output flags; it emits JSONL on stdout.
      # Run the pinned CLI and convert to SARIF ourselves so the finding still
      # lands in the Security tab like every other gate in this repo.
      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | \
            sudo sh -s -- -b /usr/local/bin "${TRUFFLEHOG_VERSION}"
          trufflehog --version
        env:
          TRUFFLEHOG_VERSION: v3.96.0

      - name: Run TruffleHog (verified secrets only)
        id: trufflehog
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCOPE="--since-commit=${{ github.event.pull_request.base.sha }}"
          else
            SCOPE=""
          fi

          set +e
          trufflehog git "file://$(pwd)" \
            ${SCOPE} \
            --only-verified \
            --json \
            --no-update > trufflehog.jsonl 2> trufflehog.log
          TH_EXIT=$?
          set -e

          tail -20 trufflehog.log || true
          if [ "$TH_EXIT" -ne 0 ] && [ ! -s trufflehog.jsonl ]; then
            echo "::error::TruffleHog failed to run (exit $TH_EXIT)"
            cat trufflehog.log
            exit "$TH_EXIT"
          fi

      - name: Convert TruffleHog findings to SARIF and enforce gate
        if: always() && hashFiles('trufflehog.jsonl') != ''
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          results, rules = [], {}
          with open("trufflehog.jsonl") as fh:
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      f = json.loads(line)
                  except json.JSONDecodeError:
                      continue

                  detector = f.get("DetectorName", "unknown")
                  meta = (f.get("SourceMetadata") or {}).get("Data") or {}
                  git = meta.get("Git") or {}
                  path = git.get("file", "unknown")
                  line_no = git.get("line", 1) or 1

                  rules.setdefault(detector, {
                      "id": detector,
                      "name": f"Verified secret: {detector}",
                      "shortDescription": {"text": f"Verified {detector} credential committed to the repository"},
                      "defaultConfiguration": {"level": "error"},
                  })
                  results.append({
                      "ruleId": detector,
                      # A verified, live credential is always CRITICAL under the
                      # repo CVSS policy — SARIF level "error" blocks the merge.
                      "level": "error",
                      "message": {"text": f"Verified {detector} secret found in {path}"},
                      "locations": [{"physicalLocation": {
                          "artifactLocation": {"uri": path},
                          "region": {"startLine": int(line_no)},
                      }}],
                  })

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {"driver": {
                      "name": "TruffleHog",
                      "informationUri": "https://github.com/trufflesecurity/trufflehog",
                      "rules": list(rules.values()),
                  }},
                  "results": results,
              }],
          }
          with open("trufflehog.sarif", "w") as fh:
              json.dump(sarif, fh, indent=2)

          print(f"TruffleHog — verified secrets: {len(results)}")
          for r in results:
              print(f"  [CRITICAL] {r['message']['text']}")

          if results:
              print(f"::error::TruffleHog found {len(results)} VERIFIED secrets — blocking PR")
              sys.exit(1)
          print("TruffleHog: no verified secrets found.")
          PYEOF

      - name: Upload TruffleHog SARIF
        if: always() && hashFiles('trufflehog.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trufflehog.sarif
          category:   trufflehog

# =============================================================================
# JOB 6 — License Compliance (FOSSA)
# =============================================================================
  license-check:
    name: License Compliance — FOSSA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # `cache: npm` hard-fails when there is no lockfile, and this repo has no
      # Node project at all — only enable the Node toolchain when one exists.
      - name: Detect Node project
        id: node-project
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ] || [ -f npm-shrinkwrap.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Node lockfile — skipping Node license tooling."
          fi

      - name: Set up Node
        if: steps.node-project.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # FOSSA is optional: without an API key the CLI cannot talk to the service,
      # so gate the whole thing on the secret rather than failing every PR.
      - name: Check FOSSA configuration
        id: fossa-config
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          if [ -n "${FOSSA_API_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FOSSA_API_KEY not configured — falling back to pip-licenses policy check."
          fi

      # FOSSA publishes no checksums file, so the installer is downloaded to
      # disk and its SHA recorded in the log before execution. That does not
      # prevent a compromised script, but it makes the exact bytes that ran
      # reproducible after the fact — which `curl | bash` does not
      # (semgrep: gha-curl-pipe-shell).
      - name: Install FOSSA CLI
        if: steps.fossa-config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          curl -sSfL -H 'Cache-Control: no-cache' \
            -o /tmp/fossa-install.sh \
            https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh
          echo "Installer SHA256: $(sha256sum /tmp/fossa-install.sh | cut -d" " -f1)"
          bash /tmp/fossa-install.sh

      - name: Run FOSSA analyze
        if: steps.fossa-config.outputs.enabled == 'true'
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
          BRANCH:        ${{ github.head_ref || github.ref_name }}
          SHA:           ${{ github.sha }}
        run: |
          fossa analyze --branch "${BRANCH}" --revision "${SHA}"

      - name: Run FOSSA license test
        if: steps.fossa-config.outputs.enabled == 'true'
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
          SHA:           ${{ github.sha }}
        run: |
          fossa test --timeout 300 --revision "${SHA}" || {
            echo "::error::FOSSA license check failed — one or more dependencies violate the license policy"
            exit 1
          }

      # Always-on fallback that matches the actual stack (Python), replacing the
      # Node license-checker that could never run against this repo.
      - name: pip-licenses policy check (Python)
        if: always()
        run: |
          pip install --quiet pip-licenses
          pip install --quiet -r app/requirements.txt

          pip-licenses --format=json --with-urls > license-report.json

          python3 - <<'PYEOF'
          import json, sys

          # Strong copyleft is incompatible with the distribution model here.
          DENY = {"GPL-2.0", "GPL-3.0", "AGPL-1.0", "AGPL-3.0",
                  "GNU General Public License v2 (GPLv2)",
                  "GNU General Public License v3 (GPLv3)",
                  "GNU Affero General Public License v3"}

          with open("license-report.json") as fh:
              pkgs = json.load(fh)

          violations = [p for p in pkgs if p.get("License", "").strip() in DENY]
          print(f"Scanned {len(pkgs)} Python packages; {len(violations)} policy violations.")
          for v in violations:
              print(f"  [VIOLATION] {v['Name']}=={v['Version']} — {v['License']}")

          if violations:
              print("::error::Copyleft-licensed dependencies violate the license policy — blocking PR")
              sys.exit(1)
          print("License policy: OK")
          PYEOF

      - name: license-checker (Node, only when a Node project exists)
        if: always() && steps.node-project.outputs.present == 'true'
        run: |
          npm install --global license-checker
          license-checker \
            --production \
            --excludePrivatePackages \
            --failOn "GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0" \
            --json > node-license-report.json || {
              echo "::warning::Potentially incompatible Node licenses detected"
            }

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report-${{ github.sha }}
          path: license-report.json
          retention-days: 30

# =============================================================================
# JOB 7 — SBOM Generation (CycloneDX)
# =============================================================================
  sbom-generate:
    name: SBOM — CycloneDX Generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft (SBOM generator)
        uses: ./.github/actions/install-tool
        with:
          tool: syft
          version: "1.49.0"

      - name: Generate CycloneDX SBOM
        run: |
          syft dir:. \
            --output cyclonedx-json=sbom-cyclonedx.json \
            --output spdx-json=sbom-spdx.json \
            --config .syft.yaml 2>/dev/null || \
          syft dir:. \
            --output cyclonedx-json=sbom-cyclonedx.json \
            --output spdx-json=sbom-spdx.json

      - name: Validate CycloneDX SBOM
        run: |
          # Install cyclonedx-cli for validation
          sudo curl -sSfL \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64" \
            -o /usr/local/bin/cyclonedx-cli
          sudo chmod +x /usr/local/bin/cyclonedx-cli

          # Derive the spec version from the document instead of pinning v1_5 —
          # Syft now emits CycloneDX 1.6 and the hardcoded pin failed validation.
          SPEC_VERSION=$(python3 -c \
            "import json;print(json.load(open('sbom-cyclonedx.json')).get('specVersion','1.6'))")
          echo "Detected CycloneDX specVersion: ${SPEC_VERSION}"

          cyclonedx-cli validate \
            --input-file sbom-cyclonedx.json \
            --input-format json \
            --input-version "v${SPEC_VERSION//./_}" \
            --fail-on-errors

      - name: Display SBOM component summary
        run: |
          python3 - <<'PYEOF'
          import json

          with open("sbom-cyclonedx.json") as f:
              sbom = json.load(f)

          components = sbom.get("components", [])
          print(f"Total components: {len(components)}")

          by_type = {}
          for c in components:
              t = c.get("type", "unknown")
              by_type[t] = by_type.get(t, 0) + 1

          for t, count in sorted(by_type.items(), key=lambda x: -x[1]):
              print(f"  {t}: {count}")
          PYEOF

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-pr-${{ github.sha }}
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json
          retention-days: 90

# =============================================================================
# JOB 8 — Security Gate Summary (all jobs must pass)
# =============================================================================
  security-gate-summary:
    name: Security Gate Summary
    runs-on: ubuntu-24.04
    needs:
      - pre-commit-check
      - sast-semgrep
      - sast-bandit
      - sca-trivy
      - secret-scan
      - license-check
      - sbom-generate
    if: always()
    timeout-minutes: 5
    steps:
      - name: Evaluate gate results
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const results = Object.entries(needs).map(([job, data]) => ({
              job,
              result: data.result
            }));

            console.log("Security Gate Results:");
            results.forEach(r => console.log(`  ${r.job}: ${r.result}`));

            const failed = results.filter(r => r.result === "failure");
            const skipped = results.filter(r => r.result === "skipped");
            const passed = results.filter(r => r.result === "success");

            if (failed.length > 0) {
              const failedNames = failed.map(r => r.job).join(", ");
              core.setFailed(
                `Security gate FAILED. Blocking jobs: ${failedNames}. ` +
                `This PR cannot be merged until all CRITICAL/HIGH findings are resolved.`
              );
            } else {
              console.log(`All security gates passed. ${passed.length} jobs succeeded, ${skipped.length} skipped.`);
            }
