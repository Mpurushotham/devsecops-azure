# =============================================================================
# CI/CD Pipeline — Azure DevSecOps
# =============================================================================
# Flow:
#   Dev  → git commit → PR (peer + security review) → protected branch merge
#   CI   → Build (reproducible, pinned deps) → Unit/Integration tests
#   Sec  → SAST (SonarQube/Semgrep) → SCA (Trivy/Snyk) → Image scan → DAST
#   Artifacts → Sign (cosign + SLSA) → Store (GitHub Packages / ACR)
#   Deploy → Staging (smoke test) → Approval gate → Production (blue/green)
#
# CVSS Thresholds:
#   > 9.0        → block build (CRITICAL)
#   7.0 – 8.9   → warn + create Jira/GH ticket (HIGH)
#   < 7.0        → log only (MEDIUM / LOW)
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel in-flight runs for the same ref to avoid queue buildup
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Global environment ─────────────────────────────────────────────────────
env:
  ACR_REGISTRY:        ${{ vars.ACR_REGISTRY }}          # e.g. myregistry.azurecr.io
  ACR_REPOSITORY:      ${{ vars.ACR_REPOSITORY }}        # e.g. myapp
  IMAGE_TAG:           ${{ github.sha }}
  SONAR_HOST_URL:      ${{ vars.SONAR_HOST_URL }}
  PYTHON_VERSION:      "3.12"
  APP_DIR:             "app"                             # Build context + source root
  HEALTH_PATH:         "/healthz"                        # Flask liveness probe
  SLSA_GENERATOR_REF: "v2.0.0"

# ── Permissions (least-privilege per job where possible) ───────────────────
permissions:
  contents:      read
  packages:      write
  id-token:      write   # Required for OIDC (cosign keyless, SLSA)
  security-events: write # Required for SARIF upload
  issues:        write   # Required to create security tickets
  pull-requests: write

# =============================================================================
# JOB 1 — Lint & Static Analysis (fast-fail gate)
# =============================================================================
jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history for SonarQube blame data

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Install lint dependencies
        run: pip install --quiet flake8 black isort

      - name: Run flake8 (syntax + undefined names are hard errors)
        run: |
          flake8 "${APP_DIR}" --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run flake8 (full style report — advisory)
        run: |
          flake8 "${APP_DIR}" --count --max-line-length=120 --statistics --exit-zero

      - name: Run black (format check)
        run: black --check --diff "${APP_DIR}"

      - name: Run isort (import order check)
        run: isort --check-only --diff "${APP_DIR}"

# =============================================================================
# JOB 2 — Build (reproducible, pinned)
# =============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 20
    outputs:
      build-version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      # Context values via env, not interpolated into the shell: `${{ }}` is
      # substituted before the shell parses the line, so a ref name containing
      # shell metacharacters would execute (semgrep: run-shell-injection).
      - name: Set build version
        id: set-version
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA:      ${{ github.sha }}
        run: |
          echo "version=${REF_NAME}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build wheel (reproducible — SOURCE_DATE_EPOCH pinned to the commit)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"

          pip install --quiet build
          # Dependencies are fully pinned in requirements.txt, so resolving them
          # here proves the lockset installs cleanly before we build an image.
          pip install --quiet -r "${APP_DIR}/requirements.txt"
          python -m build --wheel --outdir dist/ "${APP_DIR}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

# =============================================================================
# JOB 3 — Unit & Integration Tests with Coverage
# =============================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Install runtime + test dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet pytest pytest-cov

      # Tests import `from src.main import app`, so pytest must run with app/ as
      # the rootdir — hence working-directory rather than a repo-root invocation.
      - name: Run unit tests with coverage
        working-directory: ${{ env.APP_DIR }}
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            ${{ env.APP_DIR }}/coverage.xml
            ${{ env.APP_DIR }}/junit.xml
          retention-days: 7

# =============================================================================
# JOB 4 — SAST: SonarQube
# =============================================================================
  sast-sonarqube:
    name: SAST — SonarQube
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: ${{ env.APP_DIR }}/

      # SonarQube is optional infrastructure — without a token the scanner
      # cannot authenticate, so skip rather than fail the pipeline.
      - name: Check SonarQube configuration
        id: sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ] && [ -n "${SONAR_HOST_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN/SONAR_HOST_URL not configured — skipping SonarQube scan."
          fi

      - name: SonarQube Scan (Python)
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=devsecops-azure
            -Dsonar.sources=${{ env.APP_DIR }}/src
            -Dsonar.tests=${{ env.APP_DIR }}/tests
            -Dsonar.python.coverage.reportPaths=${{ env.APP_DIR }}/coverage.xml
            -Dsonar.python.version=3.12
            -Dsonar.qualitygate.wait=true

# =============================================================================
# JOB 5 — SAST: Semgrep
# =============================================================================
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 15
    container:
      # Pinned: `latest` silently changed behaviour between runs, which is the
      # opposite of what a security gate should do.
      image: semgrep/semgrep:1.89.0
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (OWASP Top-10 + security-audit)
        run: |
          # `semgrep ci` requires a SEMGREP_APP_TOKEN and a clean git context;
          # without them it exits non-zero for reasons unrelated to findings,
          # which made this gate fail on every run and report it as a CRITICAL
          # finding. `semgrep scan` runs the same rules with no account.
          set +e
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --sarif \
            --output semgrep.sarif \
            --timeout 60 \
            . > semgrep.log 2>&1
          SEMGREP_EXIT=$?
          set -e

          tail -50 semgrep.log
          if [ "${SEMGREP_EXIT}" -gt 1 ]; then
            echo "::error::Semgrep failed to run (exit ${SEMGREP_EXIT})"
            exit "${SEMGREP_EXIT}"
          fi

      - name: Enforce CVSS thresholds (Semgrep)
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os, sys

          if not os.path.exists("semgrep.sarif"):
              print("No Semgrep SARIF output — treating as clean.")
              sys.exit(0)

          with open("semgrep.sarif") as fh:
              sarif = json.load(fh)

          critical = high = 0
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  level = result.get("level", "note")
                  loc = ""
                  if result.get("locations"):
                      pl = result["locations"][0].get("physicalLocation", {})
                      loc = "{}:{}".format(
                          pl.get("artifactLocation", {}).get("uri", ""),
                          pl.get("region", {}).get("startLine", ""))
                  if level == "error":
                      critical += 1
                      print(f"  [CRITICAL] {result.get('ruleId','')} @ {loc}")
                  elif level == "warning":
                      high += 1
                      print(f"  [HIGH]     {result.get('ruleId','')} @ {loc}")

          print(f"Semgrep — CRITICAL: {critical}, HIGH: {high}")
          if critical > 0:
              print(f"::error::Semgrep CRITICAL findings ({critical}) — CVSS > 9.0, blocking build")
              sys.exit(1)
          if high > 0:
              print(f"::warning::Semgrep HIGH findings ({high}) — CVSS 7.0-8.9, ticket will be filed")
          PYEOF

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category:   semgrep

# =============================================================================
# JOB 6 — SCA: Trivy (filesystem / dependency scan)
# =============================================================================
  sca-scan:
    name: SCA — Trivy Dependency Scan
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: ./.github/actions/trivy-scan
        with:
          scan-type:      fs
          scan-ref:       .
          output:         trivy-fs.sarif
          severity:       CRITICAL,HIGH,MEDIUM
          ignore-unfixed: "true"

      # Shared gate: reads the real CVSS score from the SARIF rule properties.
      # Trivy maps BOTH critical and high to level "error", so the old inline
      # check blocked on HIGH findings that policy says should only warn.
      - name: Enforce CVSS thresholds (SCA)
        run: |
          python3 .github/scripts/cvss_gate.py trivy-fs.sarif --tool "Trivy SCA"

      - name: Upload Trivy SCA SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category:   trivy-sca

      - name: Snyk SCA scan (Python)
        if: env.SNYK_ENABLED == 'true'
        uses: snyk/actions/python-3.10@master
        continue-on-error: true
        env:
          SNYK_TOKEN:   ${{ secrets.SNYK_TOKEN }}
          SNYK_ENABLED: ${{ secrets.SNYK_TOKEN != '' }}
        with:
          args: >
            --severity-threshold=high
            --sarif-file-output=snyk.sarif
            --file=app/requirements.txt
            --package-manager=pip

      - name: Upload Snyk SARIF
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category:   snyk

# =============================================================================
# JOB 7 — Build & Push Container Image
# =============================================================================
  image-build:
    name: Container Image Build
    runs-on: ubuntu-24.04
    needs: [sast-sonarqube, sast-semgrep, sca-scan]
    timeout-minutes: 20
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-ref:    ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}@${{ steps.build-push.outputs.digest }}
      # Downstream jobs need to know whether an image actually reached a
      # registry — scanning, signing and deploying a reference that was never
      # pushed would fail confusingly.
      pushed:       ${{ steps.registry.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      # Without a registry the image can still be built and scanned locally,
      # which is the part that carries security value. Only the push needs
      # credentials, so a fork without ACR gets a real build and a real scan
      # instead of a red X.
      - name: Check registry configuration
        id: registry
        env:
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "${ACR_REGISTRY}" ] && [ -n "${ACR_USERNAME}" ] && [ -n "${ACR_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ACR not configured — building and scanning locally without pushing."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to Azure Container Registry
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Falls back to a local name when no registry is configured, so the
          # metadata action still produces usable tags for a local build.
          images: ${{ env.ACR_REGISTRY != '' && format('{0}/{1}', env.ACR_REGISTRY, env.ACR_REPOSITORY) || 'local/devsecops-app' }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile COPYs requirements.txt and src/ relative to app/,
          # so app/ — not the repo root — is the build context.
          context:    ./${{ env.APP_DIR }}
          file:       ./${{ env.APP_DIR }}/Dockerfile
          push:       ${{ github.event_name != 'pull_request' && steps.registry.outputs.enabled == 'true' }}
          load:       ${{ github.event_name == 'pull_request' || steps.registry.outputs.enabled != 'true' }}
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          sbom:       true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

# =============================================================================
# JOB 8 — Image Scan (Trivy + Grype)
# =============================================================================
  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-24.04
    needs: image-build
    if: github.event_name != 'pull_request' && needs.image-build.outputs.pushed == 'true'
    timeout-minutes: 20
    env:
      FULL_IMAGE: ${{ needs.image-build.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Trivy image scan
        uses: ./.github/actions/trivy-scan
        with:
          scan-type: image
          scan-ref:  ${{ env.FULL_IMAGE }}
          output:    trivy-image.sarif
          severity:  CRITICAL,HIGH

      # Shared gate: reads the real CVSS score from the SARIF rule properties.
      # Trivy maps BOTH critical and high to level "error", so the old inline
      # check blocked on HIGH findings that policy says should only warn.
      - name: Enforce CVSS thresholds (Image)
        run: |
          python3 .github/scripts/cvss_gate.py trivy-image.sarif --tool "Trivy image"

      - name: Install Grype
        uses: ./.github/actions/install-tool
        with:
          tool: grype
          version: "0.116.0"

      - name: Grype image scan
        env:
          IMAGE: ${{ env.FULL_IMAGE }}
        run: grype "${IMAGE}" --output sarif > grype-image.sarif

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category:   trivy-image

      - name: Upload Grype image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-image.sarif
          category:   grype-image

# =============================================================================
# JOB 9 — DAST: OWASP ZAP
# =============================================================================
  dast:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-24.04
    needs: [image-build, image-scan]
    if: >-
      needs.image-build.outputs.pushed == 'true' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Start application for DAST scan
        run: |
          docker run -d --name app-under-test \
            -p 8080:8080 \
            -e ENVIRONMENT=dast \
            -e APP_VERSION="${{ github.sha }}" \
            "${{ needs.image-build.outputs.image-ref }}"

          # Flask app exposes /healthz, not Spring Boot's /actuator/health.
          timeout 60 bash -c \
            'until curl -sf "http://localhost:8080${{ env.HEALTH_PATH }}"; do sleep 2; done'

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target:          "http://localhost:8080"
          rules_file_name: "security/zap-rules.tsv"
          cmd_options:     "-a"
          allow_issue_writing: true

      - name: Upload ZAP SARIF
        if: always() && hashFiles('results/zap.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/zap.sarif
          category:   zap-dast

      - name: Stop test application
        if: always()
        run: docker stop app-under-test && docker rm app-under-test

# =============================================================================
# JOB 10 — Sign Artifact (cosign + SLSA provenance)
# =============================================================================
  sign-artifact:
    name: Sign Artifact (cosign + SLSA)
    runs-on: ubuntu-24.04
    needs: [image-build, image-scan, dast]
    if: >-
      needs.image-build.outputs.pushed == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 15
    env:
      IMAGE_REF: ${{ needs.image-build.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Sign image (keyless OIDC via Sigstore)
        run: |
          cosign sign --yes \
            --rekor-url https://rekor.sigstore.dev \
            "${{ env.IMAGE_REF }}"

      - name: Install Syft
        uses: ./.github/actions/install-tool
        with:
          tool: syft
          version: "1.49.0"

      - name: Attach SBOM attestation
        env:
          IMAGE: ${{ env.IMAGE_REF }}
        run: |
          syft "${IMAGE}" -o cyclonedx-json > sbom-cyclonedx.json

          # Attest SBOM to image
          cosign attest --yes \
            --predicate sbom-cyclonedx.json \
            --type cyclonedx \
            "${{ env.IMAGE_REF }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-cyclonedx.json
          retention-days: 90

# =============================================================================
# JOB 11 — Deploy to Staging
# =============================================================================
  deploy-staging:
    name: Deploy — Staging
    runs-on: ubuntu-24.04
    needs: [image-build, sign-artifact]
    if: >-
      needs.image-build.outputs.pushed == 'true' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    timeout-minutes: 20
    environment:
      name: staging
      url:  ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # cosign and argocd are used below but were never installed in this job.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Install ArgoCD CLI
        run: |
          sudo curl -sSL -o /usr/local/bin/argocd \
            "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64"
          sudo chmod +x /usr/local/bin/argocd
          argocd version --client

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group:  ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name:    ${{ vars.AKS_CLUSTER_NAME }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify cosign signature before deploy
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer     "https://token.actions.githubusercontent.com" \
            "${{ needs.image-build.outputs.image-ref }}"

      - name: Deploy to staging (ArgoCD sync)
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app set myapp-staging \
            --helm-set image.repository="${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}" \
            --helm-set image.tag="sha-${{ github.sha }}" \
            --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
          argocd app sync myapp-staging \
            --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
          argocd app wait myapp-staging --health --timeout 120 \
            --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web

      - name: Run smoke tests against staging
        run: |
          STAGING_URL="${{ vars.STAGING_URL }}"

          # Liveness + readiness (Flask endpoints, not Spring actuator)
          curl -sf "${STAGING_URL}${{ env.HEALTH_PATH }}" | jq -e '.status == "ok"'
          curl -sf "${STAGING_URL}/readyz"                | jq -e '.status == "ready"'

          # API smoke test
          STATUS=$(curl -o /dev/null -sw "%{http_code}" "${STAGING_URL}/api/v1/info")
          [ "$STATUS" = "200" ] || { echo "Smoke test failed: HTTP $STATUS"; exit 1; }

          # Security headers must survive the deploy
          HEADERS=$(curl -sI "${STAGING_URL}${{ env.HEALTH_PATH }}")
          echo "$HEADERS" | grep -qi "x-content-type-options: nosniff" \
            || { echo "Missing X-Content-Type-Options header"; exit 1; }
          echo "$HEADERS" | grep -qi "strict-transport-security" \
            || { echo "Missing HSTS header"; exit 1; }

# =============================================================================
# JOB 12 — Manual Approval Gate → Production Deploy (Blue/Green)
# =============================================================================
  approve-and-deploy-prod:
    name: Approve & Deploy — Production
    runs-on: ubuntu-24.04
    needs: [image-build, deploy-staging]
    if: needs.image-build.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment:
      name: production         # Requires manual approval in GitHub Environments
      url:  ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Install ArgoCD CLI
        run: |
          sudo curl -sSL -o /usr/local/bin/argocd \
            "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64"
          sudo chmod +x /usr/local/bin/argocd
          argocd version --client

      - name: Set AKS production context
        uses: azure/aks-set-context@v4
        with:
          resource-group:  ${{ vars.AKS_PROD_RESOURCE_GROUP }}
          cluster-name:    ${{ vars.AKS_PROD_CLUSTER_NAME }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify cosign signature (production gate)
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer     "https://token.actions.githubusercontent.com" \
            "${{ needs.image-build.outputs.image-ref }}"

      - name: Blue/Green deploy via ArgoCD (production)
        env:
          ARGOCD_SERVER:     ${{ vars.ARGOCD_PROD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_PROD_AUTH_TOKEN }}
        run: |
          # Switch green slot to new image
          argocd app set myapp-prod-green \
            --helm-set image.repository="${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}" \
            --helm-set image.tag="sha-${{ github.sha }}" \
            --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
          argocd app sync myapp-prod-green \
            --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web
          argocd app wait myapp-prod-green --health --timeout 300 \
            --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN" --grpc-web

      - name: Production smoke test & traffic switch
        env:
          GREEN_URL:   ${{ vars.PRODUCTION_GREEN_URL }}
          HEALTH_PATH: ${{ env.HEALTH_PATH }}
          SHA:         ${{ github.sha }}
        run: |
          # Validate green slot before switching traffic
          curl -sf "${GREEN_URL}${HEALTH_PATH}" | jq -e '.status == "ok"'
          curl -sf "${GREEN_URL}/readyz"        | jq -e '.status == "ready"'

          # Patch ingress / service to point to green
          kubectl patch service myapp-prod \
            -p '{"spec":{"selector":{"slot":"green"}}}' \
            --namespace production

          echo "Traffic switched to green slot (SHA: ${SHA})"

      - name: Notify Azure Monitor on successful deploy
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_MONITOR_WEBHOOK_URL }}
          SHA:         ${{ github.sha }}
          ACTOR:       ${{ github.actor }}
          WORKFLOW:    ${{ github.workflow }}
        run: |
          # jq builds the JSON so a value containing a quote produces a string,
          # not a broken payload or an injected shell command.
          PAYLOAD=$(jq -n \
            --arg text     "Production deploy succeeded" \
            --arg sha      "${SHA}" \
            --arg actor    "${ACTOR}" \
            --arg workflow "${WORKFLOW}" \
            '{text: $text, sha: $sha, actor: $actor, workflow: $workflow}')

          curl -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
