# Pre-commit hooks for shift-left security at the Code stage.
# Install: pip install pre-commit && pre-commit install
repos:
  # ── General hygiene ───────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
        # Helm templates are Go templates, not YAML — `{{- if }}` at the start
        # of a document is a parse error for any YAML loader. They are validated
        # by `helm lint`/`helm template` in the lab CI workflow instead.
        exclude: ^lab/charts/.*/templates/.*\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: check-executables-have-shebangs
      - id: mixed-line-ending

  # ── Secret detection: detect-secrets ──────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - ".*\\.lock$"
          - --exclude-files
          - ".*test.*"
        exclude: |
          (?x)^(
            .*\.lock|
            .*test.*|
            .*\.example\..*
          )$

  # ── Secret detection: gitleaks ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Gitleaks — detect hardcoded secrets
        args: [--config=security/.gitleaks.toml]

  # ── Terraform security ────────────────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        args:
          - --args=--severity=CRITICAL,HIGH
          - --args=--exit-code=1
          # Exceptions live in one reviewed file with justifications and expiry
          # dates, rather than as scattered inline ignore comments.
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore.yaml

  # ── Kubernetes manifest linting ───────────────────────────────────────────
  - repo: local
    hooks:
      - id: hadolint
        name: Hadolint — Dockerfile linting
        entry: hadolint
        language: system
        types: [dockerfile]

  - repo: https://github.com/stackrox/kube-linter
    rev: v0.6.8
    hooks:
      - id: kube-linter
        name: kube-linter — Kubernetes security checks
        args: [--config=security/.kube-linter.yaml]
        files: ^(kubernetes|lab/kubernetes)/.*\.(yaml|yml)$

  # ── Python security ───────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Bandit — Python security linter
        args: [-ll, --recursive, -x, tests]
        files: \.py$

  # ── YAML / JSON schema validation ─────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        # No --strict: rules marked `error` in .yamllint.yaml (duplicate keys,
        # syntax) fail the hook, while cosmetic warnings such as line length in
        # embedded shell/Python heredocs stay informational.
        args: [-c, .yamllint.yaml]
        exclude: ^lab/charts/.*/templates/.*\.yaml$

  # ── Commit message linting ────────────────────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # ── Shell script analysis ─────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
