# =============================================================================
# Platform components — installed before any workload (sync wave -1)
# =============================================================================
# Chart versions are pinned. An unpinned platform chart means the ingress
# controller can change during an unrelated deploy, which is the kind of
# surprise that turns a routine change into an incident.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: https://github.com/Mpurushotham/devsecops-azure.git
    targetRevision: main
    path: lab/kubernetes/platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {prune: false, selfHeal: true}

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    # Admission policy must be running before workloads are admitted, or the
    # first sync silently bypasses every guardrail.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.2.6
    helm:
      valuesObject:
        admissionController:
          replicas: 3
        # Fail-closed: if the webhook is unreachable, reject the request rather
        # than admit an unchecked pod.
        config:
          webhooks:
            - namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: NotIn
                    values: [kube-system, kyverno]
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/Mpurushotham/devsecops-azure.git
    targetRevision: main
    # Reuses the policies from the existing DevSecOps solution rather than
    # forking a second copy that would drift.
    path: kubernetes/security/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: {prune: true, selfHeal: true}

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.11.3
    helm:
      valuesObject:
        controller:
          replicaCount: 3
          service:
            annotations:
              service.beta.kubernetes.io/azure-load-balancer-internal: "false"
              service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
          # Spread across zones: a zone failure must not take ingress with it.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
          config:
            # Security headers applied at the edge, so a service that forgets
            # them is still covered.
            hsts: "true"
            hsts-include-subdomains: "true"
            hsts-max-age: "31536000"
            ssl-protocols: "TLSv1.2 TLSv1.3"
            server-tokens: "false"
            use-forwarded-headers: "true"
            enable-modsecurity: "true"
            enable-owasp-modsecurity-crs: "true"
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
          podDisruptionBudget:
            enabled: true
            minAvailable: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.15.1
    helm:
      valuesObject:
        # KEDA authenticates to Azure with workload identity, so queue-depth
        # scalers need no connection string.
        podIdentity:
          azureWorkload:
            enabled: true
            identityId: "REPLACED_BY_TERRAFORM_OUTPUT"
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      valuesObject:
        crds:
          enabled: true
        replicaCount: 2
        prometheus:
          servicemonitor:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]

