{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dotnet-service.serviceAccountName" . }}
  labels:
    {{- include "dotnet-service.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.serviceAccount.workloadIdentityClientId }}
    # The federated credential in Terraform pins this identity to exactly this
    # namespace and service account name — the two must stay in sync.
    azure.workload.identity/client-id: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
