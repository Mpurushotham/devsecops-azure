{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dotnet-service.fullname" . }}
  labels:
    {{- include "dotnet-service.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      # cert-manager issues and renews this; the secret is never created by hand.
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "dotnet-service.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "dotnet-service.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
