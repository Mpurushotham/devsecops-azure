{{- if .Values.keyVault.enabled }}
# Secrets are read from Key Vault at mount time by the CSI driver and refreshed
# on the rotation interval configured on the cluster. Nothing is stored in git,
# in Terraform state, or in a long-lived Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "dotnet-service.fullname" . }}-kv
  labels:
    {{- include "dotnet-service.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType | default "secret" }}
        {{- end }}
  {{- if .Values.keyVault.secrets }}
  # Mirrored into a Secret only for values the app reads via env var; the
  # driver keeps it in sync and deletes it when the pod goes away.
  secretObjects:
    - secretName: {{ include "dotnet-service.fullname" . }}-kv
      type: Opaque
      data:
        {{- range .Values.keyVault.secrets }}
        - objectName: {{ .objectName }}
          key: {{ .objectName }}
        {{- end }}
  {{- end }}
{{- end }}
