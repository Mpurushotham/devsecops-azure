---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: log-aggregation
    app.kubernetes.io/part-of: observability-stack
data:
  loki.yaml: |
    # ------------------------------------------------------------------
    # Authentication
    # ------------------------------------------------------------------
    auth_enabled: true

    # ------------------------------------------------------------------
    # Server
    # ------------------------------------------------------------------
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
      grpc_server_max_recv_msg_size: 104857600   # 100 MiB
      grpc_server_max_send_msg_size: 104857600   # 100 MiB

    # ------------------------------------------------------------------
    # Common configuration (shared across components in monolithic mode)
    # ------------------------------------------------------------------
    common:
      path_prefix: /loki
      storage:
        azure:
          account_name: ${AZURE_STORAGE_ACCOUNT_NAME}
          account_key: ${AZURE_STORAGE_ACCOUNT_KEY}
          container_name: loki-chunks
      replication_factor: 3
      ring:
        kvstore:
          store: memberlist

    # ------------------------------------------------------------------
    # Distributor — receives log streams from Fluent Bit / Promtail
    # ------------------------------------------------------------------
    distributor:
      ring:
        kvstore:
          store: memberlist
      rate_store:
        max_recent_streams_per_tenant: 10000

    # ------------------------------------------------------------------
    # Ingester — writes log chunks to object storage
    # ------------------------------------------------------------------
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
          replication_factor: 3
        final_sleep: 0s
        num_tokens: 512
      chunk_idle_period: 1h
      max_chunk_age: 2h
      chunk_target_size: 1572864   # 1.5 MiB
      chunk_retain_period: 30s
      wal:
        enabled: true
        dir: /loki/wal
        checkpoint_duration: 5m
        flush_on_shutdown: true
        replay_memory_ceiling: 4GB

    # ------------------------------------------------------------------
    # Querier — serves query requests
    # ------------------------------------------------------------------
    querier:
      max_concurrent: 20
      engine:
        timeout: 3m
        max_look_back_period: 30d
      multi_tenant_queries_enabled: true

    # ------------------------------------------------------------------
    # Query frontend — parallel query execution
    # ------------------------------------------------------------------
    query_range:
      align_queries_with_step: true
      max_retries: 5
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100
            ttl: 1h

    # ------------------------------------------------------------------
    # Frontend
    # ------------------------------------------------------------------
    frontend:
      max_outstanding_per_tenant: 2048
      compress_responses: true
      log_queries_longer_than: 5s

    # ------------------------------------------------------------------
    # Memberlist (gossip-based cluster membership)
    # ------------------------------------------------------------------
    memberlist:
      join_members:
        - loki-memberlist.logging.svc.cluster.local:7946
      bind_port: 7946
      abort_if_cluster_join_fails: false
      bind_addr:
        - 0.0.0.0

    # ------------------------------------------------------------------
    # Schema configuration
    # ------------------------------------------------------------------
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: azure
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # ------------------------------------------------------------------
    # Storage configuration (Azure Blob)
    # ------------------------------------------------------------------
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index_cache
        cache_ttl: 24h
      azure:
        account_name: ${AZURE_STORAGE_ACCOUNT_NAME}
        account_key: ${AZURE_STORAGE_ACCOUNT_KEY}
        container_name: loki-chunks
        endpoint_suffix: blob.core.windows.net
        use_managed_identity: false
        chunk_delimiter: "/"
      filesystem:
        directory: /loki/chunks

    # ------------------------------------------------------------------
    # Compactor — manages index compaction and retention
    # ------------------------------------------------------------------
    compactor:
      working_directory: /loki/compactor
      shared_store: azure
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: azure

    # ------------------------------------------------------------------
    # Limits (per-tenant defaults)
    # ------------------------------------------------------------------
    limits_config:
      # Retention: 30 days
      retention_period: 720h

      # Ingestion rate limits
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 24
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 15MB

      # Query limits
      max_query_parallelism: 32
      max_query_series: 5000
      max_query_lookback: 30d
      query_timeout: 5m
      max_entries_limit_per_query: 50000

      # Stream limits
      max_streams_per_user: 0   # unlimited; rely on global limit
      max_global_streams_per_user: 50000
      max_label_names_per_series: 30
      max_label_value_length: 4096
      max_line_size: 262144   # 256 KiB

      # Splits & caching
      split_queries_by_interval: 15m

      # Allow structured metadata (Loki 3.x)
      allow_structured_metadata: true

    # ------------------------------------------------------------------
    # Ruler — alert evaluation on log streams
    # ------------------------------------------------------------------
    ruler:
      storage:
        type: azure
        azure:
          account_name: ${AZURE_STORAGE_ACCOUNT_NAME}
          account_key: ${AZURE_STORAGE_ACCOUNT_KEY}
          container_name: loki-ruler
      rule_path: /loki/rules-temp
      alertmanager_url: http://alertmanager.monitoring.svc.cluster.local:9093
      ring:
        kvstore:
          store: memberlist
      enable_api: true
      enable_alertmanager_v2: true
      evaluation_interval: 1m
      poll_interval: 1m
      remote_write:
        enabled: true
        config_refresh_period: 10s
        clients:
          default:
            url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            remote_timeout: 30s

    # ------------------------------------------------------------------
    # Table manager (legacy — kept for backward compat)
    # ------------------------------------------------------------------
    table_manager:
      retention_deletes_enabled: false
      retention_period: 0s

    # ------------------------------------------------------------------
    # Analytics opt-out
    # ------------------------------------------------------------------
    analytics:
      reporting_enabled: false
