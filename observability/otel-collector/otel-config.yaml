---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry-collector
    app.kubernetes.io/part-of: observability-stack
data:
  otel-collector-config.yaml: |
    # ==================================================================
    # OpenTelemetry Collector — AKS Production
    # Deployment mode: Deployment (gateway collector)
    # ==================================================================

    # ------------------------------------------------------------------
    # Extensions
    # ------------------------------------------------------------------
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        path: "/health/status"

      pprof:
        endpoint: 0.0.0.0:1777

      zpages:
        endpoint: 0.0.0.0:55679

      memory_ballast:
        size_mib: 512

    # ------------------------------------------------------------------
    # Receivers
    # ------------------------------------------------------------------
    receivers:
      # OTLP receiver — accepts traces, metrics, and logs from apps
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
            keepalive:
              server_parameters:
                max_connection_idle: 60s
                max_connection_age: 120s
                max_connection_age_grace: 10s
                time: 30s
                timeout: 10s
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "https://*.company.com"
                - "http://localhost:*"
              allowed_headers:
                - "X-Tenant-Id"
                - "Authorization"

      # Prometheus receiver — scrapes prometheus-formatted metrics endpoints
      prometheus:
        config:
          scrape_configs:
            - job_name: "otel-collector-self"
              scrape_interval: 30s
              static_configs:
                - targets:
                    - localhost:8888
            - job_name: "otel-collector-kubernetes"
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  target_label: __address__
                  regex: (.+)
                  replacement: $1
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod

      # Kubernetes events as logs
      k8s_events:
        auth_type: serviceAccount
        namespaces:
          - default
          - production
          - staging
          - monitoring
          - logging
          - tracing
          - falco
          - istio-system

      # Jaeger receiver (for legacy instrumented services)
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
          thrift_compact:
            endpoint: 0.0.0.0:6831

      # Zipkin receiver (for legacy services)
      zipkin:
        endpoint: 0.0.0.0:9411

      # Host metrics (when running as DaemonSet — optional)
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
          disk: {}
          network: {}
          filesystem:
            exclude_mount_points:
              mount_points:
                - /dev/*
                - /proc/*
                - /sys/*
              match_type: regexp
            exclude_fs_types:
              fs_types:
                - autofs
                - binfmt_misc
                - cgroup
                - configfs
                - debugfs
                - devpts
                - devtmpfs
                - fusectl
                - hugetlbfs
                - iso9660
                - mqueue
                - nsfs
                - overlay
                - proc
                - procfs
                - pstore
                - rpc_pipefs
                - securityfs
                - selinuxfs
                - squashfs
                - sysfs
                - tracefs
              match_type: strict

    # ------------------------------------------------------------------
    # Processors
    # ------------------------------------------------------------------
    processors:
      # Memory limiter — prevents OOM by dropping data when memory is high
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

      # Batch processor — improves throughput by batching telemetry
      batch:
        send_batch_size: 10000
        send_batch_max_size: 11000
        timeout: 10s

      # Kubernetes attributes — enrich spans/metrics/logs with k8s metadata
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.cluster.uid
          labels:
            - tag_name: app
              key: app
              from: pod
            - tag_name: app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: app.kubernetes.io/version
              key: app.kubernetes.io/version
              from: pod
            - tag_name: app.kubernetes.io/component
              key: app.kubernetes.io/component
              from: pod
            - tag_name: team
              key: team
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # Resource detection — auto-detect cloud/container environment
      resourcedetection:
        detectors:
          - env
          - azure
          - k8snode
        timeout: 30s
        override: false
        azure:
          tags:
            - environment
            - team
            - service

      # Resource processor — set/override resource attributes
      resource:
        attributes:
          - key: cluster
            value: aks-prod
            action: upsert
          - key: cloud.region
            value: eastus
            action: upsert
          - key: deployment.environment
            value: production
            action: upsert

      # Transform processor — manipulate telemetry fields
      transform/traces:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(status.code, 2) where http.status_code >= 500
              - set(status.message, "Error") where http.status_code >= 500

      transform/logs:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(severity_number, 17) where severity_text == "CRITICAL"

      # Filter processor — drop noisy/unwanted telemetry
      filter/traces:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.route"] == "/health"'
            - 'attributes["http.route"] == "/healthz"'
            - 'attributes["http.route"] == "/readyz"'
            - 'attributes["http.route"] == "/livez"'
            - 'attributes["http.route"] == "/metrics"'
            - 'name == "health_check"'

      filter/logs:
        error_mode: ignore
        logs:
          log_record:
            - 'IsMatch(body, ".*GET /health.*")'
            - 'IsMatch(body, ".*kube-probe.*")'

      # Probabilistic sampler — reduce trace volume for high-throughput services
      probabilistic_sampler:
        hash_seed: 22
        sampling_percentage: 100   # Adjust per environment; 100 = keep all

      # Tail-based sampling — keep interesting traces
      tail_sampling:
        decision_wait: 10s
        num_traces: 100000
        expected_new_traces_per_sec: 500
        policies:
          - name: keep-errors
            type: status_code
            status_code:
              status_codes:
                - ERROR
          - name: keep-slow-traces
            type: latency
            latency:
              threshold_ms: 2000
          - name: keep-http-5xx
            type: string_attribute
            string_attribute:
              key: http.status_code
              values:
                - "500"
                - "502"
                - "503"
                - "504"
          - name: probabilistic-sample
            type: probabilistic
            probabilistic:
              sampling_percentage: 10   # 10% of non-error traces

    # ------------------------------------------------------------------
    # Exporters
    # ------------------------------------------------------------------
    exporters:
      # OTLP to Tempo (traces)
      otlp/tempo:
        endpoint: tempo-distributor.tracing.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 1000

      # Prometheus remote write (metrics)
      prometheusremotewrite:
        endpoint: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      # Prometheus exporter (expose metrics for scraping)
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: otelcol
        resource_to_telemetry_conversion:
          enabled: true
        enable_open_metrics: true

      # Loki exporter (logs)
      loki:
        endpoint: http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push
        tls:
          insecure: true
        labels:
          resource:
            k8s.namespace.name: namespace
            k8s.pod.name: pod
            k8s.node.name: node
            k8s.deployment.name: deployment
            app: app
            cluster: cluster
            deployment.environment: environment
          attributes:
            severity: severity
            level: level
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s

      # Debug exporter (verbose logging for troubleshooting — disable in prod)
      debug:
        verbosity: normal
        sampling_initial: 2
        sampling_thereafter: 500

      # OTLP to Jaeger (traces — kept for legacy compatibility)
      otlp/jaeger:
        endpoint: jaeger-collector.tracing.svc.cluster.local:14250
        tls:
          insecure: true

    # ------------------------------------------------------------------
    # Service — wire together receivers, processors, exporters
    # ------------------------------------------------------------------
    service:
      extensions:
        - health_check
        - pprof
        - zpages
        - memory_ballast

      pipelines:

        # ---- Traces pipeline ----
        traces:
          receivers:
            - otlp
            - jaeger
            - zipkin
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - transform/traces
            - filter/traces
            - tail_sampling
            - batch
          exporters:
            - otlp/tempo
            - otlp/jaeger

        # ---- Metrics pipeline ----
        metrics:
          receivers:
            - otlp
            - prometheus
            - hostmetrics
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - batch
          exporters:
            - prometheusremotewrite
            - prometheus

        # ---- Logs pipeline ----
        logs:
          receivers:
            - otlp
            - k8s_events
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - transform/logs
            - filter/logs
            - batch
          exporters:
            - loki

      telemetry:
        logs:
          level: info
          initial_fields:
            service: otel-collector
        metrics:
          level: detailed
          address: 0.0.0.0:8888
