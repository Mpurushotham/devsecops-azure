[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-app"
version = "1.0.0"
description = "Azure DevSecOps reference application — Flask API with OTel, Prometheus and security headers"
requires-python = ">=3.12"
license = { text = "MIT" }

# Runtime deps are pinned in requirements.txt (the source of truth for the
# reproducible container build); mirrored here so the wheel is installable.
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.24.0",
    "opentelemetry-sdk==1.24.0",
    "opentelemetry-exporter-otlp==1.24.0",
    "opentelemetry-instrumentation-flask==0.45b0",
    "cryptography==42.0.8",
    "pydantic==2.7.4",
    "structlog==24.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
